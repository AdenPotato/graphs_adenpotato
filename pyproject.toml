[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "graphs_adenpotato"
version = "0.1.0"
description = "Graph algorithms in pure Python: Dijkstra's shortest path, BFS and DFS"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "AdenPotato" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/AdenPotato/graphs_adenpotato"
Issues = "https://github.com/AdenPotato/graphs_adenpotato/issues"

[tool.setuptools.packages.find]
where = ["src"]
